services:
  - type: web
    name: n8n-automation
    env: node
    plan: free
    buildCommand: npm ci && NODE_OPTIONS="--max-old-space-size=2048" npm run build
    startCommand: NODE_OPTIONS="--max-old-space-size=1024" npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true


